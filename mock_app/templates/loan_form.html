<html>
<head><title>CU Servicing Console</title></head>
<body bgcolor="#d6d3ce">
{% include "_tabs.html" %}
<table cellpadding="4" cellspacing="0" border="1">
<tr><td>
  <table cellpadding="2" cellspacing="0" border="0">
    <tr><td colspan="2"><b>Create New Loan - Member {{ member_id }} ({{ member.name }})</b></td></tr>
    {% if error %}
    <tr><td colspan="2"><font color="red">{{ error }}</font></td></tr>
    {% endif %}
    <tr><td colspan="2">
      <form method="post" action="/member/{{ member_id }}/loans/new">
        <table cellpadding="2" cellspacing="0" border="0">
          <tr>
            <td>Loan Amount ($):</td>
            <td><input type="text" name="loan_amount" size="12"></td>
          </tr>
          <tr>
            <td>Loan Purpose:</td>
            <td>
              <select name="loan_purpose">
                <option value="Auto">Auto</option>
                <option value="Home Improvement">Home Improvement</option>
                <option value="Personal">Personal</option>
                <option value="Debt Consolidation">Debt Consolidation</option>
                <option value="Other">Other</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>Interest Rate (%):</td>
            <td><input type="text" name="interest_rate" size="8"></td>
          </tr>
          <tr>
            <td colspan="2"><input type="submit" value="Review"></td>
          </tr>
        </table>
      </form>
    </td></tr>
  </table>
</td></tr>
</table>
<br>
<a href="/member/{{ member_id }}/loans">Back to Loan Accounts</a>
</body>
</html>
